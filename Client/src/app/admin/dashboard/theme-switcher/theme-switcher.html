<div class="card flex justify-end items-center gap-4 p-2">

        <div class="flex items-center gap-2">
            <i class="pi pi-sun" ></i>
            <p-toggleswitch (onChange)="enableDark($event)" [ngModel]="this.themeState().darkTheme" />
            <i class="pi pi-moon" ></i>

        </div>
        

        <div class="relative">
            <button pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-scalein" leaveToClass="hidden"
                leaveActiveClass="animate-fadeout" [hideOnOutsideClick]="true" type="button"
                class="w-8 h-8 p-0 surface-0 dark:surface-800 border border-surface-200 dark:border-surface-600 rounded">
                <i class="pi pi-palette"></i>
            </button>
            <div
                class="absolute top-[2.5rem] right-0 hidden  p-3 bg-white dark:bg-surface-800 rounded-md shadow border border-surface-200 dark:border-surface-700 flex-col justify-start items-start gap-3.5 origin-top z-10">
                <div class="flex-col justify-start items-start gap-2 inline-flex pr-4">
                    <span class="text-sm font-medium">Основные цвета</span>
                    <div class="self-stretch justify-start items-start gap-2 inline-flex flex-wrap">
                        @for (primaryColor of primaryColors(); track primaryColor.name) {
                        <button type="button" [title]="primaryColor.name"
                            (click)="updateColors($event, 'primary', primaryColor)"
                            class="outline-2 outline-offset-1 outline-transparent cursor-pointer p-0 rounded-[50%] w-5 h-5"
                            [ngStyle]="{
                                        'background-color': getPalette500(primaryColor.palette),
                                        'outline-color': selectedPrimaryColor() === primaryColor.name ? 'var(--p-primary-color)' : ''
                                    }"></button>
                        }
                    </div>
                </div>
                <div class="flex-col justify-start items-start gap-2 inline-flex pr-2 mt-4">
                    <span class="text-sm font-medium">Цвета темного режима</span>
                    <div class="self-stretch justify-start items-start gap-2 inline-flex">
                        @for (surface of surfaces; track surface.name) {
                        <button type="button" [title]="surface.name" (click)="updateColors($event, 'surface', surface)"
                            class=" outline-2 outline-offset-1 outline-transparent cursor-pointer p-0 rounded-[50%] w-5 h-5"
                            [ngStyle]="{
                                        'background-color': surface.palette['500'],
                                        'outline-color': selectedSurfaceColor() === surface.name ? 'var(--p-primary-color)' : ''
                                    }"></button>
                        }
                    </div>
                </div>
                <div class="flex-col justify-start items-start gap-2 inline-flex w-full mt-4">
                    <span class="text-sm font-medium">Тема</span>
                    <div
                        class="inline-flex p-[0.28rem] items-start gap-[0.28rem] rounded-[0.71rem] border border-[#00000003] w-full">
                        <p-selectbutton [options]="presets" [ngModel]="selectedPreset()"
                            (ngModelChange)="onPresetChange($event)" [unselectable]="false" size="small" />
                    </div>
                </div>
            </div>
        </div>

</div>
