<div class="w-full">
    <div class=" h-screen dark:bg-surface-950 px-6 grid place-content-center login_back">
        <div
            class="grid grid-cols-2 gap-4 w-200 bg-surface-0 dark:bg-surface-900 p-8 md:p-12 shadow-sm rounded-2xl items-center border-1 border-primary-500">
            <div class="">
                <form (ngSubmit)="login()">
                    <div class="mx-auto flex flex-col gap-8 ">

                        <div class="flex flex-col gap-6 w-full">
                            <div class="flex flex-col gap-2 w-full">
                                <label for="username"
                                    class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Имя
                                    пользователя</label>
                                <input pInputText id="username" type="text" placeholder="Имя пользователя"
                                    class="w-full px-3 py-2 shadow-sm rounded-lg" [field]="loginForm.username"
                                    (keydown.enter)="login()" />
                            </div>
                            <div class="flex flex-col gap-2 w-full">
                                <label for="password"
                                    class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Пароль</label>
                                <input pInputText id="password" type="password" placeholder="Пароль"
                                    class="w-full px-3 py-2 shadow-sm rounded-lg" [field]="loginForm.password"
                                    (keydown.enter)="login()" />
                            </div>
                        </div>
                        <button pButton type="button"
                            class="w-full py-2 rounded-lg flex justify-center items-center gap-2" (click)="login()"
                            [disabled]="!loginForm().valid()">
                            <i pButtonIcon class="pi pi-user text-base! leading-normal!"></i>
                            <span pButtonLabel>Войти</span>
                        </button>
                        <div class="h-8 flex justify-center">
                            @if(error()!==''){

                            @if (error()==='server') {<span class="text-red-800">Ошибка подключения</span>}
                            @if (error()==='password') {<span class="text-red-800">Неверный логин или пароль</span>}

                            }
                        </div>
                    </div>
                </form>
            </div>
            <div class="flex flex-col justify-center items-center gap-10">
                <svg width="136" height="136" fill="none" version="1.1" viewBox="0 0 40 40"
                    xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                    <rect y="4.4409e-15" width="40" height="40" rx="5.3333" ry="5.3333" fill="url(#b)"
                        stroke-width="1.1472" />
                    <path d="m12 10h4v20h-4v-20z" fill="#fff" />
                    <path d="M16 10L28 22L16 34V10Z" fill="#fff" />
                    <path d="m24 10 4 4-8 8 8 8-4 4-12-12 12-12z" fill="url(#a)" fill-opacity=".8" />
                    <circle cx="32" cy="8" r="4" fill="#fff" />
                    <circle cx="32" cy="8" r="2" fill="#4F46E5" />
                    <defs>
                        <linearGradient id="a" x1="12" x2="28" y1="22" y2="22" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#A5B4FC" offset="0" />
                            <stop stop-color="#C4B5FD" offset="1" />
                        </linearGradient>
                        <linearGradient id="b" x1="5.8579" x2="34.142" y1="5.8579" y2="34.142"
                            gradientUnits="userSpaceOnUse">
                            <stop stop-color="#4f46e5" offset="0" />
                            <stop stop-color="#7c3aed" offset="1" />
                        </linearGradient>
                    </defs>
                </svg>
                <div class="flex flex-col items-center pb-15">
                    <div
                        class="text-surface-900 dark:text-surface-0 text-2xl font-semibold leading-tight text-center w-full">
                        Добро пожаловать</div>
                    <div class="text-center">для входа в систему <br /> введите логин и пароль</div>
                </div>
            </div>
        </div>
    </div>
</div>
