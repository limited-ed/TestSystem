<p-menu #catmenu [model]="menuItems" [popup]="true" />
<div class="flex flex-col p-2 h-full">
    <div class="flex pb-2 border-b border-b-primary-600">
        <p-button label="Добавить" icon="pi pi-plus" (click)="newCategory()" size="small"></p-button>
    </div>
    <div class="flex w-full h-[calc(100%-52px)]">
        <p-table [value]="store.categoriesEntities()" stripedRows class="h-full w-full overflow-auto" [scrollable]="true"  scrollHeight="100%"
            [size]="'small'">

            <ng-template #header>
                <tr>
                    <th class="w-[72px]">

                    </th>
                    <th class="w-[60%]">Название</th>
                    <th class="w-[40%]">Описание</th>
                </tr>
            </ng-template>
            <ng-template #body let-category>
                <tr>
                    <td>
                        <p-button icon="pi pi-ellipsis-v" [rounded]="true" [text]="true"
                            (click)="menuClick($event, category)" />
                    </td>
                    <td>{{ category.title }}</td>
                    <td>{{ category.description }}</td>

                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
