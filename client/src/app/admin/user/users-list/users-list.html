<p-menu #menu [model]="items()" [popup]="true" />
<div class="flex flex-col p-2 h-full">
    <div class="flex pb-2 border-b border-b-primary-600 items-center justify-items-end">
        <div class="">
            <p-button label="Добавить" icon="pi pi-user-plus" [disabled]="typeof(selectedGroup()) ==='undefined'"
                (click)="newUser()" size="small"></p-button>
        </div>
        <div class="grow justify-items-end"> <p-iconfield class="w-90">
                <p-autocomplete [(ngModel)]="searchQuery" [suggestions]="searchedUsers()"
                    (completeMethod)="search($event)" fluid class="w-90" />
                <p-inputicon class="pi pi-search" />
            </p-iconfield>
        </div>
    </div>
    <div class="py-2">
        <p-iftalabel class="w-full">
            <p-treeselect class="w-full" [(ngModel)]="selectedGroup" [options]="treeNodes()" inputId="select" />
            <label for="select">Выбор группы</label>
        </p-iftalabel>
    </div>
    <div class="flex w-full h-full overflow-auto">
        <div class="w-[100%] h-[calc(100%-52px)]">
            <p-table [value]="users()" stripedRows [globalFilterFields]="['fullname', 'login']" class="h-full"
                [scrollable]="true" scrollHeight="100%" size="small">
                <ng-template #header>

                    <tr>
                        <th class="w-[72px]">

                        </th>
                        <th class="w-[50%]">Имя</th>
                        <th class="w-[30%]">Логин</th>
                        <th class="">Роль</th>

                    </tr>
                </ng-template>
                <ng-template #body let-user>
                    <tr>
                        <td>
                            <p-button icon="pi pi-ellipsis-v" [rounded]="true" [text]="true"
                                (click)="menuClick($event, user)" />
                        </td>
                        <td>{{ user.fullname }}</td>
                        <td>{{ user.login }}</td>
                        <td>{{ user.role }}</td>

                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
