<div class="grid grid-cols-[2fr_3fr] grid-rows-2 items-center gap-4">

    <label for="category">Категория копросов</label>
    <p-select [options]="categories()" id="category" optionLabel="title" optionValue="id"
        [(ngModel)]="editPart().categoryId" />

    <label for="timer">Количество вопросов</label>
    <p-inputnumber [(ngModel)]="editPart().count" [min]="1" id="timer" [showButtons]="true" spinnerMode="horizontal"
        buttonLayout="horizontal">
        <ng-template #incrementbuttonicon>
            <span class="pi pi-plus"></span>
        </ng-template>
        <ng-template #decrementbuttonicon>
            <span class="pi pi-minus"></span>
        </ng-template>
    </p-inputnumber>


</div>
<div class="flex justify-end pt-30 gap-2">
    <p-button label="Сохранить" severity="secondary" size="small" (click)="ok()"
        [disabled]="editPart().categoryId === 0  || editPart().count === 0" />
    <p-button label="Отмена" severity="danger" size="small" (click)="cancel()" variant="outlined" />
</div>
