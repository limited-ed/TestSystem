services:

  api-server:
    container_name: 'api-server'
    image: 'api-server'
    build:
      context: .
      dockerfile: Api/dockerfile
    ports:
     - "8080:8080"
    depends_on:
     - "postgres"
    networks:
      - lms-network

  client:
    container_name: 'api-client'
    image: 'client'
    build:
      context: .
      dockerfile: Client/dockerfile
    ports:
     - "4000:4000"
    depends_on:
     - 'api-server'
    networks:
      - lms-network
                
  postgres:
    container_name: 'db-postgres'
    image: postgres
    environment:
      # change this for a "real" app!
      POSTGRES_PASSWORD: 1
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lms-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_user -d postgres_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  nginx-entrypoint:
    image: nginx
    hostname: nginx-entrypoint
    container_name: nginx-entrypoint
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - lms-network

networks:
  lms-network:
    driver: bridge

volumes:
  pgdata: 